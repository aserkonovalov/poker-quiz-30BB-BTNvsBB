.header { text-align: center; margin-bottom: 12px; }

.score { font-size: 0.85rem; color: #8b949e; }

.score .wrong { color: #f85149; }
.set-info { font-size: 0.8rem; color: #8b949e; margin-top: 4px; }

  display: inline-block;

  border-radius: 8px;
  background: #161b22;

  touch-action: manipulation;
  -webkit-appearance: none;
  margin-bottom: 12px;

<a href="index.html" class="back-btn">&larr; Back to Menu</a>

<div class="header">

</div>

<style>

.card-red { color: #ff6b6b; }

.question {
  text-align: center;
  font-size: 1rem;
  margin: 12px 0;
  color: #c9d1d9;
}

  display: flex;

  gap: 10px;
  width: 100%;
  max-width: 360px;
  margin: 12px 0;
}

.opt-btn {
  padding: 14px 16px;

  background: #161b22;
  color: #e6edf3;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-appearance: none;

  transition: all 0.15s;
  text-align: center;
  user-select: none;
  -webkit-user-select: none;
}
.opt-btn:active { transform: scale(0.97); background: #1c2a3f; }
.opt-btn.selected { border-color: #58a6ff; background: #1c2a3f; }
.opt-btn.correct-answer { border-color: #3fb950; background: #1a3d2a; color: #3fb950; }
.opt-btn.wrong-answer { border-color: #f85149; background: #3d1a1a; color: #f85149; }
.opt-btn.disabled { opacity: 0.7; pointer-events: none; }

.feedback {
  text-align: center;
  margin: 12px 0;
  padding: 12px;
  border-radius: 10px;
  font-size: 0.9rem;
  min-height: 60px;
  width: 100%;
  max-width: 360px;
  display: none;
}
.feedback.visible { display: block; }
.feedback.show-correct { background: #1a3d2a; border: 1px solid #3fb950; }
.feedback.show-wrong { background: #3d1a1a; border: 1px solid #f85149; }
.feedback .explain { font-size: 0.8rem; color: #8b949e; margin-top: 6px; }

.next-btn {
  padding: 14px 40px;
  border: none;
  border-radius: 12px;
  background: #58a6ff;
  color: #0d1117;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-appearance: none;
  margin-top: 12px;
  transition: transform 0.1s;
  user-select: none;
  -webkit-user-select: none;
}
.next-btn:active { transform: scale(0.95); }
.next-btn.disabled { background: #30363d; color: #8b949e; pointer-events: none; }

.progress {
  width: 100%;
  max-width: 360px;
  height: 4px;
  background: #30363d;
  border-radius: 2px;
  margin-top: 16px;
}
.progress-fill {
  height: 100%;
  background: #58a6ff;
  border-radius: 2px;
  transition: width 0.3s;
}

.results {
  text-align: center;
  margin-top: 20px;
  display: none;

.results.visible { display: block; }
.results h2 { font-size: 1.5rem; color: #58a6ff; margin-bottom: 12px; }
.results .big-score { font-size: 3rem; font-weight: 800; color: #3fb950; }
.results .restart-btn {
  margin-top: 20px;
  padding: 14px 40px;
  border: none;
  border-radius: 12px;
  background: #58a6ff;
  color: #0d1117;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-appearance: none;
}
.results .restart-btn:active { transform: scale(0.95); }

#quizArea { display: flex; flex-direction: column; align-items: center; width: 100%; }

<div id="quizArea">

var QUESTIONS_PER_SET = 10;
var TOTAL_SETS = 20;
var currentSet = 0;
var current = 0;
var score = { correct: 0, wrong: 0 };
var answered = false;
var shuffled = [];

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function getSet(setIndex) {
  var start = setIndex * QUESTIONS_PER_SET;
  var end = start + QUESTIONS_PER_SET;
  return shuffle(questions.slice(start, end));
}

function startQuiz() {
  shuffled = getSet(currentSet);
  current = 0;
  score = { correct: 0, wrong: 0 };
  answered = false;
  document.getElementById("results").classList.remove("visible");
  document.getElementById("quizArea").classList.remove("hidden");
  document.getElementById("setNum").textContent = currentSet + 1;
  render();
}

function render() {
  var q = shuffled[current];
  document.getElementById("boardCards").innerHTML = q.board.map(cardHTML).join(" ");
  document.getElementById("boardInfo").textContent = q.info;

  var optDiv = document.getElementById("options");
  optDiv.innerHTML = "";
  for (var i = 0; i < q.options.length; i++) {
    var btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.textContent = q.options[i];
    btn.setAttribute("data-idx", i);
    btn.addEventListener("touchend", handleOptionTap, false);
    btn.addEventListener("click", handleOptionClick, false);
    optDiv.appendChild(btn);
  }

  var fb = document.getElementById("feedback");
  fb.classList.remove("visible", "show-correct", "show-wrong");

  var nextBtn = document.getElementById("nextBtn");
  nextBtn.classList.add("disabled");
  answered = false;

  document.getElementById("correctCount").textContent = score.correct;
  document.getElementById("wrongCount").textContent = score.wrong;
  document.getElementById("qNum").textContent = current + 1;
  document.getElementById("progressFill").style.width = ((current) / shuffled.length * 100) + "%";
}

var touchHandled = false;

function handleOptionTap(e) {
  e.preventDefault();
  touchHandled = true;
  var idx = parseInt(this.getAttribute("data-idx"), 10);
  selectAnswer(idx);
}

function handleOptionClick(e) {
  if (touchHandled) { touchHandled = false; return; }
  var idx = parseInt(this.getAttribute("data-idx"), 10);
  selectAnswer(idx);
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;

  var q = shuffled[current];
  var btns = document.querySelectorAll(".opt-btn");
  var fb = document.getElementById("feedback");

  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.add("disabled");
  }

  if (idx === q.answer) {
    btns[idx].classList.add("correct-answer");
    score.correct++;
    fb.classList.remove("show-wrong");
    fb.classList.add("visible", "show-correct");
    document.getElementById("feedbackText").textContent = "\u2713 Correct!";
  } else {
    btns[idx].classList.add("wrong-answer");
    btns[q.answer].classList.add("correct-answer");
    score.wrong++;
    fb.classList.remove("show-correct");
    fb.classList.add("visible", "show-wrong");
    document.getElementById("feedbackText").textContent = "\u2717 Wrong";
  }
  document.getElementById("feedbackExplain").textContent = q.explain;
  document.getElementById("nextBtn").classList.remove("disabled");

  document.getElementById("correctCount").textContent = score.correct;
  document.getElementById("wrongCount").textContent = score.wrong;
}

function nextQuestion() {
  current++;
  if (current >= shuffled.length) {
    showResults();
    return;
  }
  render();
  window.scrollTo(0, 0);
}

function showResults() {
  document.getElementById("quizArea").classList.add("hidden");
  document.getElementById("results").classList.add("visible");
  var pct = Math.round((score.correct / shuffled.length) * 100);
  document.getElementById("finalScore").textContent = score.correct + "/" + shuffled.length + " (" + pct + "%)";
  var msg = "";
  if (pct >= 90) msg = "Excellent! You know this strategy cold.";
  else if (pct >= 70) msg = "Good! A few spots to review.";
  else if (pct >= 50) msg = "Decent. Keep studying the cheat sheet.";
  else msg = "Keep at it! Review the 5 rules and try again.";
  document.getElementById("finalMsg").textContent = msg;
  document.getElementById("progressFill").style.width = "100%";
}

function restart() {
  currentSet = (currentSet + 1) % TOTAL_SETS;
  startQuiz();
}

// Event listeners (iOS-safe: no inline onclick)
document.getElementById("nextBtn").addEventListener("touchend", function(e) {
  e.preventDefault();
  if (!this.classList.contains("disabled")) nextQuestion();
}, false);
document.getElementById("nextBtn").addEventListener("click", function(e) {
  if (!this.classList.contains("disabled")) nextQuestion();
}, false);

document.getElementById("restartBtn").addEventListener("touchend", function(e) {
  e.preventDefault();
  restart();
}, false);
document.getElementById("restartBtn").addEventListener("click", function(e) {
  restart();
}, false);

// Prevent double-tap zoom on iOS
document.addEventListener("touchend", function(e) {}, false);

// Init
startQuiz();

})();
</script>
