<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>3W BU 13-16BB Quiz</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0d1117; color: #e6edf3;
  min-height: 100%; display: flex; flex-direction: column; align-items: center;
  padding: 16px; padding-top: env(safe-area-inset-top, 16px);
  padding-bottom: env(safe-area-inset-bottom, 16px);
  -webkit-overflow-scrolling: touch;
}
.back-btn {
  display: inline-block; padding: 8px 16px; border: 1px solid #30363d;
  border-radius: 8px; background: #161b22; color: #8b949e;
  font-size: 0.8rem; text-decoration: none; touch-action: manipulation;
  margin-bottom: 12px; align-self: flex-start;
}
.back-btn:active { background: #1c2a3f; color: #58a6ff; }
.header { text-align: center; margin-bottom: 16px; width: 100%; max-width: 400px; }
.header h1 { font-size: 1.2rem; color: #58a6ff; margin-bottom: 4px; }
.header .sub { font-size: 0.8rem; color: #8b949e; }
.score { font-size: 0.85rem; color: #8b949e; margin-top: 6px; }
.score .correct { color: #3fb950; }
.score .wrong { color: #f85149; }
.tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.tab-btn {
  padding: 10px 18px; border: 1px solid #30363d; border-radius: 10px;
  background: #161b22; color: #8b949e; font-size: 0.85rem;
  cursor: pointer; touch-action: manipulation; transition: all 0.15s;
}
.tab-btn.active { border-color: #58a6ff; color: #58a6ff; background: #1c2a3f; }
.quiz-area { width: 100%; max-width: 400px; }
.quiz-card {
  background: #161b22; border: 1px solid #30363d; border-radius: 16px;
  padding: 24px 20px; margin-bottom: 16px;
}
.q-num { font-size: 0.75rem; color: #8b949e; margin-bottom: 8px; }
.hand-display {
  font-size: 2.2rem; font-weight: 700; text-align: center;
  margin: 12px 0 16px; letter-spacing: 2px;
}
.hand-display .suited { color: #58a6ff; }
.hand-display .offsuit { color: #f778ba; }
.hand-display .pair { color: #3fb950; }
.question { font-size: 1rem; line-height: 1.5; margin-bottom: 18px; text-align: center; }
.options { display: flex; flex-direction: column; gap: 10px; }
.opt-btn {
  width: 100%; padding: 14px 16px; border: 2px solid #30363d; border-radius: 12px;
  background: #0d1117; color: #e6edf3; font-size: 0.95rem;
  cursor: pointer; touch-action: manipulation; transition: all 0.12s; text-align: center;
}
.opt-btn:active { transform: scale(0.97); }
.opt-btn.correct { border-color: #3fb950; background: #0d2818; color: #3fb950; }
.opt-btn.wrong { border-color: #f85149; background: #2d1214; color: #f85149; }
.opt-btn:disabled { cursor: default; opacity: 0.9; }
.feedback {
  margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  font-size: 0.85rem; line-height: 1.4; display: none;
}
.feedback.show { display: block; }
.feedback.correct-fb { background: #0d2818; color: #7ee2a8; border: 1px solid #238636; }
.feedback.wrong-fb { background: #2d1214; color: #ffa198; border: 1px solid #da3633; }
.nav-row { display: flex; gap: 10px; justify-content: center; margin-top: 12px; width: 100%; max-width: 400px; }
.nav-btn {
  flex: 1; padding: 12px; border: 1px solid #30363d; border-radius: 10px;
  background: #161b22; color: #e6edf3; font-size: 0.9rem;
  cursor: pointer; touch-action: manipulation; text-align: center;
}
.nav-btn:active { background: #1c2a3f; }
.nav-btn:disabled { opacity: 0.4; cursor: default; }
.reset-btn {
  margin-top: 16px; padding: 10px 24px; border: 1px solid #58a6ff;
  border-radius: 10px; background: transparent; color: #58a6ff;
  font-size: 0.85rem; cursor: pointer; touch-action: manipulation;
}
.reset-btn:active { background: #1c2a3f; }
</style>
</head>
<body>
<a href="../index.html" class="back-btn">&larr; Back to Menu</a>

<div class="header">
  <h1>3W BU 13-16BB Quiz</h1>
  <div class="sub">Spin &amp; Go &bull; Team Bas Poker</div>
  <div class="score">
    <span class="correct" id="correctCount">0</span> correct &bull;
    <span class="wrong" id="wrongCount">0</span> wrong &bull;
    Q <span id="qNum">1</span>/<span id="qTotal">15</span>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" id="tab-corner" onclick="switchTab('corner')">Corner Cases</button>
  <button class="tab-btn" id="tab-vsallin" onclick="switchTab('vsallin')">vs All-in</button>
</div>

<div class="quiz-area" id="quiz-area"></div>

<div class="nav-row">
  <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">&larr; Prev</button>
  <button class="nav-btn" id="next-btn" onclick="navigate(1)">Next &rarr;</button>
</div>

<button class="reset-btn" onclick="resetQuiz()">Reset Quiz</button>

<script>
const cornerQuestions = [
  { hand: "AA", type: "pair", q: "You hold AA on BU, 14BB. You raise 2x, get 3-bet (non-AI). What do you do?", options: ["Jam (re-raise AI)","Call","Fold"], answer: "Call", explain: "AA is blue — 2x raise, call vs AI, CALL vs NAI 3b. Slowplay to stay balanced with hands like A7s-A9s that also just call." },
  { hand: "77", type: "pair", q: "You hold 77 on BU, 15BB. How do you enter the pot?", options: ["All-in","2x Raise","Fold"], answer: "2x Raise", explain: "77 is teal — 2x raise, call vs AI, jam vs NAI 3b. It's the LOWEST pair that raises. 66 and below jam." },
  { hand: "66", type: "pair", q: "You hold 66 on BU, 14BB. Action?", options: ["All-in","2x Raise","Fold"], answer: "All-in", explain: "66 is green — open jam. All pairs 22-66 are all-in. 77+ raises 2x." },
  { hand: "KQo", type: "offsuit", q: "You hold KQo on BU, 13BB. What's your play?", options: ["2x Raise","All-in","Fold"], answer: "All-in", explain: "KQo is green — all-in jam! Despite being a strong hand, at 13-16BB it jams rather than raises. AKo is teal (raises)." },
  { hand: "ATo", type: "offsuit", q: "You hold ATo on BU, 15BB. Action?", options: ["2x Raise","All-in","Fold"], answer: "All-in", explain: "ATo is green — open jam. The offsuit Ace-Tens through A8o all jam rather than raise at this stack depth." },
  { hand: "A7s", type: "suited", q: "You hold A7s on BU, 14BB. How do you open?", options: ["2x Raise","All-in","Fold"], answer: "2x Raise", explain: "A7s is blue — 2x raise, call vs AI, call vs NAI 3b. Boundary: A7s raises, A6s jams. The suited playability keeps it as a raise." },
  { hand: "A6s", type: "suited", q: "You hold A6s on BU, 14BB. Action?", options: ["2x Raise","All-in","Fold"], answer: "All-in", explain: "A6s is green — all-in. A6s-A2s all jam. A7s is the first suited Ace that raises 2x." },
  { hand: "QTs", type: "suited", q: "You hold QTs on BU, 13BB. What do you do?", options: ["2x Raise","All-in","Fold"], answer: "All-in", explain: "QTs is green — open jam! At 13-16BB, QTs jams rather than raises. QJs (blue) raises 2x." },
  { hand: "QJs", type: "suited", q: "You hold QJs on BU, 15BB. Action?", options: ["2x Raise","All-in","Fold"], answer: "2x Raise", explain: "QJs is blue — 2x raise, call AI, call vs NAI 3b. One notch above QTs (jam)." },
  { hand: "T9s", type: "suited", q: "You hold T9s on BU, 14BB. Play?", options: ["2x Raise","All-in","Fold"], answer: "All-in", explain: "T9s is green — all-in jam. Strong connected suited hands at this depth prefer to jam for maximum fold equity." },
  { hand: "KJo", type: "offsuit", q: "You hold KJo on BU, 13BB. Action?", options: ["2x Raise","All-in","Fold"], answer: "2x Raise", explain: "KJo is red — 2x raise, fold vs AI, fold vs NAI 3b. Thin steal that gives up to aggression." },
  { hand: "K5s", type: "suited", q: "You hold K5s on BU, 15BB. Open or fold?", options: ["2x Raise","All-in","Fold"], answer: "2x Raise", explain: "K5s is red — 2x raise, fold vs AI, fold vs NAI 3b. The weakest suited King in range. K4s is a fold." },
  { hand: "K4s", type: "suited", q: "You hold K4s on BU, 14BB. Action?", options: ["2x Raise","All-in","Fold"], answer: "Fold", explain: "K4s is fold. K5s is the cutoff for suited Kings." },
  { hand: "JTs", type: "suited", q: "You hold JTs on BU, 16BB. What do you do?", options: ["2x Raise","All-in","Fold"], answer: "All-in", explain: "JTs is green — open jam. Like QTs and T9s, connected suited hands at this depth prefer to jam." },
  { hand: "A8o", type: "offsuit", q: "You hold A8o on BU, 14BB. How do you play?", options: ["2x Raise","All-in","Fold"], answer: "All-in", explain: "A8o is green — open jam. A8o, A9o, ATo all jam. A7o drops to red (raise/fold)." }
];

const vsAllinQuestions = [
  { hand: "A7s", type: "suited", q: "You raised 2x with A7s. Villain jams. Call or fold?", options: ["Call","Fold"], answer: "Call", explain: "A7s is blue — call vs all-in. All suited Aces that raise 2x (A7s-A9s) call jams." },
  { hand: "KTs", type: "suited", q: "You raised 2x with KTs. Villain shoves. Call?", options: ["Call","Fold"], answer: "Call", explain: "KTs is blue — call vs all-in. All suited Kings that raise (KQs-KTs) call jams." },
  { hand: "K9s", type: "suited", q: "You raised K9s, villain jams 15BB. Call?", options: ["Call","Fold"], answer: "Fold", explain: "K9s is red — FOLD vs all-in. Only K-broadway suited (KQs-KTs) call. K9s and below fold to jams." },
  { hand: "QJs", type: "suited", q: "You raised QJs, villain shoves. Call or fold?", options: ["Call","Fold"], answer: "Call", explain: "QJs is blue — call vs all-in. It's the only suited Queen that raises AND calls jams." },
  { hand: "Q9s", type: "suited", q: "You opened Q9s, villain goes all-in. Decision?", options: ["Call","Fold"], answer: "Fold", explain: "Q9s is red — fold vs all-in. Fold to everything. Only QJs calls jams among suited Queens." },
  { hand: "AKs", type: "suited", q: "You raised 2x with AKs. Villain shoves. Call?", options: ["Call","Fold"], answer: "Call", explain: "AKs is teal — call vs all-in AND jam vs NAI 3b. Premium hand, snap call." },
  { hand: "77", type: "pair", q: "You raised 2x with 77. Villain jams. Call?", options: ["Call","Fold"], answer: "Call", explain: "77 is teal — call vs all-in. All pairs 77+ that raise will call a jam." },
  { hand: "KJo", type: "offsuit", q: "You opened KJo, villain shoves. Call?", options: ["Call","Fold"], answer: "Fold", explain: "KJo is red — fold vs all-in. Despite being a broadway hand, at this depth it folds to jams." },
  { hand: "QJo", type: "offsuit", q: "You raised QJo, villain goes all-in. Call?", options: ["Call","Fold"], answer: "Fold", explain: "QJo is red — fold vs all-in. All offsuit broadways below AKo-AJo fold to jams (or jam themselves)." },
  { hand: "AJo", type: "offsuit", q: "You raised AJo, villain jams. Call?", options: ["Call","Fold"], answer: "Call", explain: "AJo is teal — call vs all-in. AKo, AQo, AJo all raise and call jams." },
  { hand: "JTo", type: "offsuit", q: "You opened JTo, villain shoves. Your move?", options: ["Call","Fold"], answer: "Fold", explain: "JTo is red — fold vs all-in. Thin steal that gives up to any aggression." },
  { hand: "A7o", type: "offsuit", q: "You opened A7o, villain jams. Call?", options: ["Call","Fold"], answer: "Fold", explain: "A7o is red — fold vs all-in. The weakest offsuit Ace in range. It raises to steal but can't call." },
  { hand: "98s", type: "suited", q: "You raised 98s, villain shoves. Call or fold?", options: ["Call","Fold"], answer: "Fold", explain: "98s is red — fold vs all-in. All mid suited connectors in the raising range (98s, 97s, 87s, T8s) fold to jams." },
  { hand: "AA", type: "pair", q: "You raised 2x with AA. Villain shoves. Call?", options: ["Call","Fold"], answer: "Call", explain: "AA is blue — call vs all-in. Obviously calling, but note: vs a NAI 3-bet, AA just calls (doesn't jam) to stay balanced." },
  { hand: "QQ", type: "pair", q: "You raised 2x with QQ. Villain jams. Call?", options: ["Call","Fold"], answer: "Call", explain: "QQ is teal — call vs all-in AND jam vs a NAI 3-bet. Unlike AA/KK, Queens re-jam the 3-bet." }
];

let currentTab = 'corner';
const state = {
  corner: { idx: 0, answers: {}, correct: 0, wrong: 0 },
  vsallin: { idx: 0, answers: {}, correct: 0, wrong: 0 }
};

function getQs() { return currentTab === 'corner' ? cornerQuestions : vsAllinQuestions; }
function getState() { return state[currentTab]; }

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-corner').classList.toggle('active', tab === 'corner');
  document.getElementById('tab-vsallin').classList.toggle('active', tab === 'vsallin');
  render();
}

function render() {
  const s = getState();
  const qs = getQs();
  const q = qs[s.idx];
  const answered = s.answers[s.idx] !== undefined;

  document.getElementById('correctCount').textContent = s.correct;
  document.getElementById('wrongCount').textContent = s.wrong;
  document.getElementById('qNum').textContent = s.idx + 1;
  document.getElementById('qTotal').textContent = qs.length;

  let html = `<div class="quiz-card">
    <div class="q-num">Question ${s.idx + 1} of ${qs.length}</div>
    <div class="hand-display"><span class="${q.type}">${q.hand}</span></div>
    <div class="question">${q.q}</div>
    <div class="options">`;

  q.options.forEach(opt => {
    let cls = '';
    if (answered) {
      if (opt === q.answer) cls = 'correct';
      else if (opt === s.answers[s.idx] && opt !== q.answer) cls = 'wrong';
    }
    const escaped = opt.replace(/'/g, "\\'");
    html += `<button class="opt-btn ${cls}" ${answered ? 'disabled' : ''} onclick="pick('${escaped}')">${opt}</button>`;
  });

  html += `</div>`;
  const fbClass = answered ? (s.answers[s.idx] === q.answer ? 'correct-fb' : 'wrong-fb') : '';
  html += `<div class="feedback ${answered ? 'show' : ''} ${fbClass}">${q.explain}</div>`;
  html += `</div>`;

  document.getElementById('quiz-area').innerHTML = html;
  document.getElementById('prev-btn').disabled = s.idx === 0;
  document.getElementById('next-btn').disabled = s.idx === qs.length - 1;
}

function pick(chosen) {
  const s = getState();
  if (s.answers[s.idx] !== undefined) return;
  s.answers[s.idx] = chosen;
  if (chosen === getQs()[s.idx].answer) s.correct++;
  else s.wrong++;
  render();
}

function navigate(dir) {
  const s = getState();
  const qs = getQs();
  s.idx = Math.max(0, Math.min(qs.length - 1, s.idx + dir));
  render();
}

function resetQuiz() {
  state[currentTab] = { idx: 0, answers: {}, correct: 0, wrong: 0 };
  render();
}

render();
</script>
</body>
</html>
