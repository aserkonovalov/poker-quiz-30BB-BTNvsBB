<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>3W BU 13-16BB Quiz</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0d1117;
  color: #e6edf3;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
  padding-top: env(safe-area-inset-top, 16px);
  padding-bottom: env(safe-area-inset-bottom, 16px);
  -webkit-overflow-scrolling: touch;
}
.back-btn {
  display: inline-block; padding: 8px 16px; border: 1px solid #30363d;
  border-radius: 8px; background: #161b22; color: #8b949e;
  font-size: 0.8rem; text-decoration: none; touch-action: manipulation;
  -webkit-appearance: none; margin-bottom: 12px; align-self: flex-start;
}
.back-btn:active { background: #1c2a3f; color: #58a6ff; }

.header { text-align: center; margin-bottom: 16px; width: 100%; max-width: 400px; }
.header h1 { font-size: 1.2rem; color: #58a6ff; margin-bottom: 4px; }
.header .sub { font-size: 0.8rem; color: #8b949e; }
.score { font-size: 0.85rem; color: #8b949e; margin-top: 6px; }
.score .correct { color: #3fb950; }
.score .wrong { color: #f85149; }

/* Tabs */
.tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.tab-btn {
  padding: 10px 18px; border: 1px solid #30363d; border-radius: 10px;
  background: #161b22; color: #8b949e; font-size: 0.85rem;
  cursor: pointer; touch-action: manipulation; -webkit-appearance: none;
  transition: all 0.15s;
}
.tab-btn.active { border-color: #58a6ff; color: #58a6ff; background: #1c2a3f; }

/* Card */
.quiz-area { width: 100%; max-width: 400px; }
.quiz-card {
  background: #161b22; border: 1px solid #30363d; border-radius: 16px;
  padding: 24px 20px; margin-bottom: 16px;
}
.q-num { font-size: 0.75rem; color: #8b949e; margin-bottom: 8px; }
.hand-display {
  font-size: 2.2rem; font-weight: 700; text-align: center;
  margin: 12px 0 16px; letter-spacing: 2px;
}
.hand-display .suited { color: #58a6ff; }
.hand-display .offsuit { color: #f778ba; }
.hand-display .pair { color: #3fb950; }
.question { font-size: 1rem; line-height: 1.5; margin-bottom: 18px; text-align: center; }

/* Options */
.options { display: flex; flex-direction: column; gap: 10px; }
.opt-btn {
  width: 100%; padding: 14px 16px; border: 2px solid #30363d; border-radius: 12px;
  background: #0d1117; color: #e6edf3; font-size: 0.95rem;
  cursor: pointer; touch-action: manipulation; -webkit-appearance: none;
  transition: all 0.12s; text-align: center;
}
.opt-btn:active { transform: scale(0.97); }
.opt-btn.correct { border-color: #3fb950; background: #0d2818; color: #3fb950; }
.opt-btn.wrong { border-color: #f85149; background: #2d1214; color: #f85149; }
.opt-btn:disabled { cursor: default; opacity: 0.9; }

/* Feedback */
.feedback {
  margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  font-size: 0.85rem; line-height: 1.4; display: none;
}
.feedback.show { display: block; }
.feedback.correct-fb { background: #0d2818; color: #7ee2a8; border: 1px solid #238636; }
.feedback.wrong-fb { background: #2d1214; color: #ffa198; border: 1px solid #da3633; }

/* Nav */
.nav-row { display: flex; gap: 10px; justify-content: center; margin-top: 12px; width: 100%; max-width: 400px; }
.nav-btn {
  flex: 1; padding: 12px; border: 1px solid #30363d; border-radius: 10px;
  background: #161b22; color: #e6edf3; font-size: 0.9rem;
  cursor: pointer; touch-action: manipulation; -webkit-appearance: none;
  text-align: center;
}
.nav-btn:active { background: #1c2a3f; }
.nav-btn:disabled { opacity: 0.4; cursor: default; }

.reset-btn {
  margin-top: 16px; padding: 10px 24px; border: 1px solid #58a6ff;
  border-radius: 10px; background: transparent; color: #58a6ff;
  font-size: 0.85rem; cursor: pointer; touch-action: manipulation;
}
.reset-btn:active { background: #1c2a3f; }
</style>
</head>
<body>
<a href="../index.html" class="back-btn">&larr; Back to Menu</a>

<div class="header">
  <h1>3W BU 13-16BB Quiz</h1>
  <div class="sub">Spin &amp; Go • Team Bas Poker</div>
  <div class="score">
    <span class="correct" id="correctCount">0</span> correct &bull;
    <span class="wrong" id="wrongCount">0</span> wrong &bull;
    Q <span id="qNum">1</span>/<span id="qTotal">15</span>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" id="tab-corner" onclick="switchTab('corner')">Corner Cases</button>
  <button class="tab-btn" id="tab-vsallin" onclick="switchTab('vsallin')">vs All-in</button>
</div>

<div class="quiz-area" id="quiz-area"></div>

<div class="nav-row">
  <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">&larr; Prev</button>
  <button class="nav-btn" id="next-btn" onclick="navigate(1)">Next &rarr;</button>
</div>

<button class="reset-btn" onclick="resetQuiz()">Reset Quiz</button>

<script>
const cornerQuestions = [
  { hand: "A7s", type: "suited", q: "You hold A7s on BU, 14BB deep, 3-way. What's your action?", options: ["Fold","2x Raise","All-in"], answer: "2x Raise", explain: "A7s is blue — 2x raise, call vs AI, call vs NAI 3b. Key boundary: A6s and below are all-in jams (green), A7s is the first suited Ace that raises 2x." },
  { hand: "K9o", type: "offsuit", q: "You hold K9o on BU, 15BB. Open or fold?", options: ["Fold","2x Raise","All-in"], answer: "2x Raise", explain: "K9o is pink — 2x raise, fold vs AI, call vs NAI 3b. Last offsuit King in range (K8o is a fold)." },
  { hand: "K8o", type: "offsuit", q: "You hold K8o on BU, 13BB. Your action?", options: ["Fold","2x Raise","All-in"], answer: "Fold", explain: "K8o is a fold. K9o is the cutoff for offsuit Kings." },
  { hand: "77", type: "pair", q: "You hold 77 on BU, 14BB. Open-raise 2x or jam?", options: ["2x Raise","All-in","Fold"], answer: "All-in", explain: "77 is green (jam). 88+ open to 2x. Boundary: 77=jam, 88=raise." },
  { hand: "88", type: "pair", q: "You hold 88 on BU, 15BB. How do you enter?", options: ["All-in","2x Raise","Fold"], answer: "2x Raise", explain: "88 is teal — 2x raise, call vs AI, jam vs NAI 3b. Lowest pair that raises." },
  { hand: "Q7s", type: "suited", q: "You hold Q7s on BU, 14BB. What's the play?", options: ["Fold","2x Raise / call AI","2x Raise / fold AI"], answer: "2x Raise / fold AI", explain: "Q7s is red — 2x raise, fold to AI and fold to NAI 3b. Weakest suited Queen in range (Q6s is fold)." },
  { hand: "Q9s", type: "suited", q: "You hold Q9s on BU, 13BB. Raise and then?", options: ["2x / fold AI / call 3b","2x / call AI","Fold"], answer: "2x / fold AI / call 3b", explain: "Q9s is pink — fold vs AI but call a non-all-in 3-bet." },
  { hand: "JTo", type: "offsuit", q: "You hold JTo on BU, 16BB. Action?", options: ["Fold","2x Raise / call AI","2x Raise / fold AI"], answer: "2x Raise / fold AI", explain: "JTo is red — 2x raise, fold vs AI, fold vs NAI 3b. Thin steal only. QTo (teal) is the cutoff for offsuit broadways that call jams." },
  { hand: "A7o", type: "offsuit", q: "You hold A7o on BU, 14BB. What do you do?", options: ["Fold","2x Raise / call AI","2x Raise / fold AI"], answer: "2x Raise / fold AI", explain: "A7o is pink — fold vs AI. Weakest offsuit Ace in range (A6o folds). A8o is teal!" },
  { hand: "87s", type: "suited", q: "You hold 87s on BU, 15BB. Action?", options: ["Fold","2x Raise / fold AI","All-in"], answer: "2x Raise / fold AI", explain: "87s is red — thin steal, fold to all aggression." },
  { hand: "76s", type: "suited", q: "You hold 76s on BU, 14BB. Raise or fold?", options: ["Fold","2x Raise / fold AI","All-in"], answer: "2x Raise / fold AI", explain: "76s is red — thin open that folds to everything. Weakest suited connector in range." },
  { hand: "65s", type: "suited", q: "You hold 65s on BU, 13BB. Action?", options: ["Fold","2x Raise / fold AI","All-in"], answer: "2x Raise / fold AI", explain: "65s is red — steal that folds to aggression. 64s would be a fold." },
  { hand: "K5s", type: "suited", q: "You hold K5s on BU, 15BB. Open or fold?", options: ["Fold","2x Raise / call AI","2x Raise / fold AI"], answer: "2x Raise / call AI", explain: "K5s is blue — weakest suited King that opens. K4s is a fold!" },
  { hand: "K4s", type: "suited", q: "You hold K4s on BU, 14BB. Action?", options: ["Fold","2x Raise","All-in"], answer: "Fold", explain: "K4s is a fold. K5s is the cutoff for suited Kings." },
  { hand: "T9s", type: "suited", q: "You hold T9s on BU, 13BB. What category?", options: ["2x / call AI","2x / fold AI / call 3b","2x / fold AI / fold 3b"], answer: "2x / fold AI / call 3b", explain: "T9s is pink — fold vs AI but call a non-AI 3-bet. T8s (red) folds to both." }
];

const vsAllinQuestions = [
  { hand: "A5s", type: "suited", q: "You hold A5s on BU, 14BB. What's your action?", options: ["2x Raise","All-in","Fold"], answer: "All-in", explain: "A5s is green — open jam! A2s-A6s are all all-in. A7s is the first suited Ace that raises 2x." },
  { hand: "A7s", type: "suited", q: "You raised 2x with A7s. Villain shoves. Call?", options: ["Call","Fold"], answer: "Call", explain: "A7s is blue — call vs all-in. Drops from teal only for the 3b response." },
  { hand: "K9s", type: "suited", q: "You raised K9s, villain jams 15BB. Call?", options: ["Call","Fold"], answer: "Call", explain: "K9s is blue — call vs all-in. All suited Kings in range call jams." },
  { hand: "K9o", type: "offsuit", q: "You opened K9o, villain shoves. Call or fold?", options: ["Call","Fold"], answer: "Fold", explain: "K9o is pink — FOLD vs all-in! Offsuit doesn't have the equity." },
  { hand: "Q9s", type: "suited", q: "You opened Q9s, villain goes all-in. Decision?", options: ["Call","Fold"], answer: "Fold", explain: "Q9s is pink — fold vs all-in. QTs+ call, Q9s and below fold to jams." },
  { hand: "QTs", type: "suited", q: "You raised QTs, villain jams. Call?", options: ["Call","Fold"], answer: "Call", explain: "QTs is teal — call vs AI. Boundary: QTs+ call, Q9s folds." },
  { hand: "JTo", type: "offsuit", q: "You opened JTo, villain shoves. Your move?", options: ["Call","Fold"], answer: "Fold", explain: "JTo is red — FOLD vs AI. It's a thin steal that folds to any aggression. QTo is the last offsuit broadway that calls." },
  { hand: "J9s", type: "suited", q: "You raised J9s, villain jams. Call or fold?", options: ["Call","Fold"], answer: "Fold", explain: "J9s is pink — fold vs AI. JTs calls, J9s doesn't." },
  { hand: "T9s", type: "suited", q: "You opened T9s, villain shoves. Decision?", options: ["Call","Fold"], answer: "Fold", explain: "T9s is pink — fold vs AI despite being a strong connector." },
  { hand: "99", type: "pair", q: "You raised 99, villain jams. Call?", options: ["Call","Fold"], answer: "Call", explain: "99 is teal — clear call. All 88+ pairs call the jam." },
  { hand: "A7o", type: "offsuit", q: "You opened A7o, villain shoves. Call?", options: ["Call","Fold"], answer: "Fold", explain: "A7o is pink — FOLD vs AI! A8o (teal) calls. One pip difference." },
  { hand: "A8o", type: "offsuit", q: "You raised A8o, villain jams. Call or fold?", options: ["Call","Fold"], answer: "Call", explain: "A8o is teal — call vs AI. Boundary: A8o+ call, A7o folds." },
  { hand: "98s", type: "suited", q: "You opened 98s, villain shoves. Your decision?", options: ["Call","Fold"], answer: "Fold", explain: "98s is pink — fold vs all-in. Not enough equity at this depth." },
  { hand: "87s", type: "suited", q: "You raised 87s, villain goes all-in. Call?", options: ["Call","Fold"], answer: "Fold", explain: "87s is red — fold vs AI and fold vs 3b. Pure steal." },
  { hand: "KTs", type: "suited", q: "You opened KTs, villain shoves 14BB. Call?", options: ["Call","Fold"], answer: "Call", explain: "KTs is teal — call vs AI and jam vs NAI 3b. Premium." }
];

let currentTab = 'corner';
const state = {
  corner: { idx: 0, answers: {}, correct: 0, wrong: 0 },
  vsallin: { idx: 0, answers: {}, correct: 0, wrong: 0 }
};

function getQs() { return currentTab === 'corner' ? cornerQuestions : vsAllinQuestions; }
function getState() { return state[currentTab]; }

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-corner').classList.toggle('active', tab === 'corner');
  document.getElementById('tab-vsallin').classList.toggle('active', tab === 'vsallin');
  render();
}

function render() {
  const s = getState();
  const qs = getQs();
  const q = qs[s.idx];
  const answered = s.answers[s.idx] !== undefined;

  document.getElementById('correctCount').textContent = s.correct;
  document.getElementById('wrongCount').textContent = s.wrong;
  document.getElementById('qNum').textContent = s.idx + 1;
  document.getElementById('qTotal').textContent = qs.length;

  let typeClass = q.type;
  let html = `<div class="quiz-card">
    <div class="q-num">Question ${s.idx + 1} of ${qs.length}</div>
    <div class="hand-display"><span class="${typeClass}">${q.hand}</span></div>
    <div class="question">${q.q}</div>
    <div class="options">`;

  q.options.forEach(opt => {
    let cls = '';
    if (answered) {
      if (opt === q.answer) cls = 'correct';
      else if (opt === s.answers[s.idx] && opt !== q.answer) cls = 'wrong';
    }
    const escaped = opt.replace(/'/g, "\\'");
    html += `<button class="opt-btn ${cls}" ${answered ? 'disabled' : ''} onclick="pick('${escaped}')">${opt}</button>`;
  });

  html += `</div>`;
  const fbClass = answered ? (s.answers[s.idx] === q.answer ? 'correct-fb' : 'wrong-fb') : '';
  html += `<div class="feedback ${answered ? 'show' : ''} ${fbClass}">${q.explain}</div>`;
  html += `</div>`;

  document.getElementById('quiz-area').innerHTML = html;
  document.getElementById('prev-btn').disabled = s.idx === 0;
  document.getElementById('next-btn').disabled = s.idx === qs.length - 1;
}

function pick(chosen) {
  const s = getState();
  if (s.answers[s.idx] !== undefined) return;
  s.answers[s.idx] = chosen;
  if (chosen === getQs()[s.idx].answer) s.correct++;
  else s.wrong++;
  render();
}

function navigate(dir) {
  const s = getState();
  const qs = getQs();
  s.idx = Math.max(0, Math.min(qs.length - 1, s.idx + dir));
  render();
}

function resetQuiz() {
  state[currentTab] = { idx: 0, answers: {}, correct: 0, wrong: 0 };
  render();
}

render();
</script>
</body>
</html>
