<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<title>Spin &amp; Go Trainer</title>
<style>
  :root{--bg:#0f1115;--panel:#191c22;--panel2:#21252e;--ink:#e8eaed;--muted:#9aa3ad;
    --fold:#8fd3f6;--open:#f6a178;--push:#ef6a2d;--call:#f2d53c;--check:#f2d53c;
    --raisesmall:#f6a178;--raisemid:#ef6a2d;--raisejam:#7c7af0;
    --na:#4a4f59;--line:#2c313b;--good:#2ecc71;--bad:#e74c3c;--accent:#ffd34d;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
  header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:10;padding-top:calc(14px + env(safe-area-inset-top))}
  h1{font-size:16px;margin:0;font-weight:600}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:9px 13px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;touch-action:manipulation}
  .tab.active{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
  .posbar{display:flex;gap:8px;margin-bottom:16px}
  .postab{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:13px 8px;border-radius:11px;cursor:pointer;font-weight:800;font-size:16px;letter-spacing:.5px;touch-action:manipulation;text-align:center}
  .postab.active{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  .stat{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
  .stat b{color:var(--ink)}
  .hand{font-size:clamp(48px,16vw,66px);font-weight:800;letter-spacing:2px;text-align:center;margin:4px 0 2px;line-height:1.1}
  .depthline{text-align:center;color:var(--muted);margin-bottom:16px;font-size:14px}
  .depthline b{color:var(--accent)}
  .qtitle{text-align:center;font-weight:700;margin:2px 0 12px;font-size:15px}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .ab{flex:1 1 0;min-width:80px;max-width:200px;padding:16px 10px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);color:var(--ink);font-size:17px;font-weight:700;cursor:pointer;transition:.1s;touch-action:manipulation}
  .ab:active{transform:scale(.97)}
  .ab .sub{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:3px}
  .ab.fold{border-left:6px solid var(--fold)}.ab.open{border-left:6px solid var(--open)}.ab.push{border-left:6px solid var(--push)}.ab.call{border-left:6px solid var(--call)}
  .ab.check{border-left:6px solid var(--check)}.ab.raisesmall{border-left:6px solid var(--raisesmall)}.ab.raisemid{border-left:6px solid var(--raisemid)}.ab.raisejam{border-left:6px solid var(--raisejam)}
  .feedback{margin-top:16px;text-align:center;font-weight:700;min-height:24px;font-size:15px}
  .feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
  .pcts{text-align:center;color:var(--muted);font-size:13px;margin-top:4px}
  .next{display:block;margin:14px auto 0;background:var(--accent);color:#1a1a1a;border:none;padding:14px 26px;border-radius:11px;font-weight:700;font-size:15px;cursor:pointer;width:100%;max-width:280px;touch-action:manipulation}
  .matrixWrap{margin-top:16px;display:none}.matrixWrap.show{display:block}
  .matrix{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;width:100%;max-width:560px;margin:10px auto}
  .cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:clamp(6px,1.9vw,10px);font-weight:700;color:#10131a;border-radius:3px;overflow:hidden}
  .cell.na{color:#8a8f99}.cell.hl{outline:3px solid var(--accent);outline-offset:-1px;z-index:2}
  .legend{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .sw{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:5px}
  details{margin-top:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:2px 14px}
  summary{cursor:pointer;font-weight:700;padding:10px 0}
  .modeRow{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .modeRow .lbl{color:var(--muted);font-size:13px;width:100%;text-align:center;margin-bottom:2px}
  .mini{font-size:13px;color:var(--muted);text-align:center;margin-top:6px}
  .emptyMiss{color:var(--muted);text-align:center;padding:30px 10px}
  .settingsRow{margin-bottom:6px}
  .switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;font-size:14px;color:var(--muted)}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .track{width:44px;height:26px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;position:relative;transition:.15s;flex:none}
  .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.15s}
  .switch input:checked + .track{background:var(--accent);border-color:var(--accent)}
  .switch input:checked + .track .knob{left:20px;background:#1a1a1a}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:20px}
  @media (max-width:480px){.wrap{padding:12px}.card{padding:14px;border-radius:12px}.ab .sub{display:none}.ab{font-size:15px;padding:14px 4px;min-width:70px}.stat{font-size:12px;gap:10px;width:100%;justify-content:space-between}header{flex-direction:column;align-items:stretch;gap:8px}h1{text-align:center}}
</style>
</head>
<body>
<header>
  <h1>&#9824; Spin &amp; Go Trainer</h1>
  <div class="stat"><span>Score <b id="score">0</b>/<b id="total">0</b></span><span>Streak <b id="streak">0</b></span><span>Acc <b id="acc">&mdash;</b></span><span>Misses <b id="missN">0</b></span></div>
</header>
<div class="wrap">

  <div class="posbar">
    <button class="postab active" data-pos="BTN">BTN</button>
    <button class="postab" data-pos="SB">SB</button>
    <button class="postab" data-pos="BB">BB</button>
    <button class="postab" data-pos="MIX">Mix</button>
  </div>

  <div class="card" id="trainerCard">
    <div class="modeRow">
      <span class="lbl">Stack depth</span>
      <div class="tabs" id="depthTabs">
        <button class="tab" data-d="25">25 BB</button>
        <button class="tab" data-d="15">15 BB</button>
        <button class="tab" data-d="10">10 BB</button>
        <button class="tab active" data-d="mix">Mixed</button>
      </div>
    </div>
    <div class="modeRow">
      <span class="lbl">Drill mode</span>
      <div class="tabs" id="modeTabs">
        <button class="tab active" data-m="all">All hands</button>
        <button class="tab" data-m="mixed">Mixed cells only</button>
        <button class="tab" data-m="miss">Repeat my misses</button>
      </div>
    </div>
    <div class="modeRow settingsRow">
      <label class="switch"><input type="checkbox" id="autoAdvance"><span class="track"><span class="knob"></span></span><span>Auto-advance on correct</span></label>
    </div>

    <div class="hand" id="handLabel">&mdash;&mdash;</div>
    <div class="depthline" id="depthLine">Effective stack: <b id="depthLabel">?</b> BB</div>
    <div class="qtitle" id="qtitle">What&rsquo;s your action?</div>

    <div class="btns" id="answerBtns"></div>
    <div class="feedback" id="feedback"></div>
    <div class="pcts" id="pcts"></div>
    <div class="emptyMiss" id="emptyMiss" style="display:none">No misses yet &mdash; play some hands first.</div>
    <button class="next" id="nextBtn" style="display:none">Next hand &rarr;</button>

    <div class="matrixWrap" id="matrixWrap">
      <div class="mini" id="mxCaption"></div>
      <div class="matrix" id="matrix"></div>
      <div class="legend" id="mxLegend"></div>
    </div>
  </div>

  <div class="card">
    <details>
      <summary>Show a full range chart</summary>
      <div class="modeRow" style="margin-top:12px">
        <div class="tabs" id="viewTabs"></div>
      </div>
      <div class="matrix" id="viewMatrix"></div>
      <div class="legend" id="viewLegend"></div>
    </details>
  </div>

</div>
<footer>Data sampled from Lucid Spin &amp; Go ranges. Majority-colour rule. Local, no network.</footer>

const RANKS="AKQJT98765432".split("");
const MIX_HI=85;

/* ---- Colour maps ---- */
const C_BTN_OPEN={Fold:"var(--fold)",Open:"var(--open)",Push:"var(--push)"};
const C_BTN_CALL={Call:"var(--call)",Fold:"var(--fold)",NA:"var(--na)"};
const C_SB={Fold:"var(--fold)",Call:"var(--call)",RaiseSmall:"var(--raisesmall)",RaiseJam:"var(--raisemid)"};
const C_BB={Check:"var(--check)",RaiseSmall:"var(--raisesmall)",RaiseMid:"var(--raisemid)",RaiseJam:"var(--raisejam)"};

/* ---- Helpers ---- */
function handAt(r,c){const a=RANKS[r],b=RANKS[c];if(r===c)return a+b;return c>r?a+b+"s":b+a+"o";}
function allHands(){const o=[];for(let r=0;r<13;r++)for(let c=0;c<13;c++)o.push(handAt(r,c));return o;}
function lsGet(k){try{return localStorage.getItem("spinT_"+k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem("spinT_"+k,v);}catch(e){}}

/* ---- Per-position config ---- */
/* BTN open */
function btnOpenData(d){return DATA.BTN.open[d];}
function btnCallData(d){return DATA.BTN.call&&DATA.BTN.call[d];}
function btnOpenActions(d){return d==="25"?["Fold","Open"]:["Fold","Open","Push"];}
const BTN_SUB={"Fold":"fold","Open":"Raise 2","Push":"jam all-in"};
/* SB play (BTN folds) */
function sbData(d){return DATA.SB.play[d];}
const SB_SIZING={"25":{rs:"Raise 3",rj:"Push"},"15":{rs:"Raise 2.25",rj:"Push"},"10":{rs:"Raise 2",rj:"Push"}};
function sbActions(d){const s=SB_SIZING[d];const a=["Fold","Call",s.rs,s.rj];if(d==="10")return ["Fold",s.rs,s.rj];return a;}/* 10BB has 0% Call */
function sbActionKey(label,d){const s=SB_SIZING[d];if(label==="Fold")return"Fold";if(label==="Call")return"Call";if(label===s.rs)return"RaiseSmall";if(label===s.rj)return"RaiseJam";return label;}
function sbKeyToLabel(key,d){const s=SB_SIZING[d];if(key==="RaiseSmall")return s.rs;if(key==="RaiseJam")return s.rj;return key;}
function sbBtnClass(label,d){const k=sbActionKey(label,d);return{Fold:"fold",Call:"call",RaiseSmall:"raisesmall",RaiseJam:"raisemid"}[k]||"";}
/* BB play (SB limps) */
function bbData(d){return DATA.BB.play[d];}
const BB_SIZING={"25":{rs:"Raise 3",rm:"Raise 25",rj:null},"15":{rs:"Raise 3",rm:"Raise 5",rj:"Raise 15"},"10":{rs:"Raise 3",rm:"Raise 10",rj:null}};
function bbActions(d){
  const s=BB_SIZING[d],dd=bbData(d),acts=["Check",s.rs];
  /* only include RaiseMid if it actually appears (>0.5% of hands use it) */
  const ah=allHands();const hasMid=ah.some(h=>dd[h]&&dd[h].p.RaiseMid&&dd[h].p.RaiseMid>2);
  if(hasMid)acts.push(s.rm);
  if(s.rj){const hasJam=ah.some(h=>dd[h]&&dd[h].p.RaiseJam&&dd[h].p.RaiseJam>2);if(hasJam)acts.push(s.rj);}
  return acts;
}
function bbActionKey(label,d){const s=BB_SIZING[d];if(label==="Check")return"Check";if(label===s.rs)return"RaiseSmall";if(label===s.rm)return"RaiseMid";if(s.rj&&label===s.rj)return"RaiseJam";return label;}
function bbKeyToLabel(key,d){const s=BB_SIZING[d];if(key==="Check")return"Check";if(key==="RaiseSmall")return s.rs;if(key==="RaiseMid")return s.rm||"Raise";if(key==="RaiseJam")return s.rj||"Jam";return key;}
function bbBtnClass(label,d){const k=bbActionKey(label,d);return{Check:"check",RaiseSmall:"raisesmall",RaiseMid:"raisemid",RaiseJam:"raisejam"}[k]||"";}

/* ---- State ---- */
let posMode="BTN",depthMode="mix",drillMode="all";
let cur=null,curDepth=null,curPos=null,answered=false,phase="main";
let score=0,total=0,streak=0,misses=[];
let autoAdvance=(lsGet("autoAdvance")==="1"),advanceTimer=null;

function depthsInPlay(){return depthMode==="mix"?["25","15","10"]:[depthMode];}
function positionsInPlay(){return posMode==="MIX"?["BTN","SB","BB"]:[posMode];}
function isMixed(pos,d,h){
  const dd=getRangeData(pos,d);if(!dd||!dd[h])return false;
  return Math.max(...Object.values(dd[h].p))<MIX_HI;
}
function getRangeData(pos,d){
  if(pos==="BTN")return btnOpenData(d);
  if(pos==="SB")return sbData(d);
  if(pos==="BB")return bbData(d);
  return null;
}
function getAction(pos,d,h){const dd=getRangeData(pos,d);return dd&&dd[h]?dd[h].a:null;}

function mixedPool(){
  const p=[];
  positionsInPlay().forEach(pos=>depthsInPlay().forEach(d=>allHands().forEach(h=>{if(isMixed(pos,d,h))p.push({pos,depth:d,hand:h});})));
  return p;
}
function pickQuestion(){
  if(drillMode==="miss")return misses.length?misses[Math.floor(Math.random()*misses.length)]:null;
  if(drillMode==="mixed"){const p=mixedPool();return p.length?p[Math.floor(Math.random()*p.length)]:null;}
  const poss=positionsInPlay(),pos=poss[Math.floor(Math.random()*poss.length)];
  const ds=depthsInPlay(),d=ds[Math.floor(Math.random()*ds.length)];
  return {pos,depth:d,hand:allHands()[Math.floor(Math.random()*169)]};
}

/* ---- UI ---- */
function flash(msg,good){const fb=document.getElementById("feedback");fb.textContent=msg;fb.className="feedback "+(good?"good":"bad");}
function showPcts(p){document.getElementById("pcts").textContent=Object.entries(p).filter(([k,v])=>v>0).map(([k,v])=>k+" "+v+"%").join("  \u00b7  ");}
function recordMiss(){if(!misses.some(m=>m.pos===curPos&&m.depth===curDepth&&m.hand===cur))misses.push({pos:curPos,depth:curDepth,hand:cur});}

const SPOT_DESC={BTN:"On the <b>Button</b>, first in",SB:"In the <b>SB</b>, BTN folds",BB:"In the <b>BB</b>, SB limps"};

function setButtons(actions,onPick,clsFn){
  const box=document.getElementById("answerBtns");box.innerHTML="";
  actions.forEach(act=>{
    const b=document.createElement("button");
    const cls=clsFn?clsFn(act):act.toLowerCase();
    b.className="ab "+cls;
    b.innerHTML=act;
    b.onclick=()=>onPick(act);box.appendChild(b);
  });
}

function afterResolved(wasCorrect){
  const btn=document.getElementById("nextBtn");btn.textContent="Next hand \u2192";btn.onclick=newQuestion;
  if(wasCorrect&&autoAdvance){btn.style.display="none";advanceTimer=setTimeout(newQuestion,450);}else{btn.style.display="block";}
}
function updateStats(){
  document.getElementById("score").textContent=score;document.getElementById("total").textContent=total;
  document.getElementById("streak").textContent=streak;
  document.getElementById("acc").textContent=total?Math.round(100*score/total)+"%":"\u2014";
  document.getElementById("missN").textContent=misses.length;
}

/* ---- Matrix rendering ---- */
function buildMatrix(container,getAct,colorMap,isNA,highlight){
  container.innerHTML="";
  for(let r=0;r<13;r++)for(let c=0;c<13;c++){
    const h=handAt(r,c),act=getAct(h);
    const cell=document.createElement("div");
    cell.className="cell"+(isNA&&isNA(act)?" na":"")+(h===highlight?" hl":"");
    cell.style.background=colorMap[act]||"var(--na)";cell.textContent=h;container.appendChild(cell);
  }
}
function getColorMap(pos){
  if(pos==="BTN")return C_BTN_OPEN;
  if(pos==="SB")return C_SB;
  if(pos==="BB")return C_BB;
  return C_BTN_OPEN;
}
function showMatrixForPos(pos,depth,hand){
  const dd=getRangeData(pos,depth);if(!dd)return;
  const cm=getColorMap(pos);
  document.getElementById("mxCaption").innerHTML=pos+" strategy \u2014 "+depth+"BB";
  const lg=Object.entries(cm).map(([k,v])=>'<span><i class="sw" style="background:'+v+'"></i>'+k+'</span>').join("");
  document.getElementById("mxLegend").innerHTML=lg;
  buildMatrix(document.getElementById("matrix"),h=>dd[h]?dd[h].a:"Fold",cm,null,hand);
  document.getElementById("matrixWrap").classList.add("show");
}

/* ---- BTN call follow-up ---- */
function hasCall(depth){return DATA.BTN.call&&DATA.BTN.call.hasOwnProperty(depth);}
function liveCall(depth,who){const c=DATA.BTN.call&&DATA.BTN.call[depth]&&DATA.BTN.call[depth][who]&&DATA.BTN.call[depth][who][cur];return c&&c.a!=="NA";}

function askCall(){
  phase="call";answered=false;
  document.getElementById("feedback").textContent="";document.getElementById("feedback").className="feedback";
  document.getElementById("pcts").textContent="";document.getElementById("matrixWrap").classList.remove("show");
  document.getElementById("qtitle").innerHTML="You min-raised \u2014 opponent <b>jams</b>. Call?";
  const cd=DATA.BTN.call[curDepth];
  const bbE=cd.BB[cur],sbE=cd.SB[cur];
  const bb=bbE?bbE.a:"NA",sb=sbE?sbE.a:"NA";
  const split=(bb!==sb);
  setButtons(["Call","Fold"],function(choice){
    if(answered)return;answered=true;total++;
    if(split){score++;streak++;flash("\u2139 Depends on who jams \u2014 counted correct",true);
      const callWho=bb==="Call"?"BB":"SB",foldWho=bb==="Call"?"SB":"BB";
      document.getElementById("pcts").innerHTML="<b>"+cur+"</b>: Call vs <b>"+callWho+"</b> jam \u00b7 Fold vs <b>"+foldWho+"</b> jam";
      updateStats();afterResolved(true);return;
    }
    const correct=bb;
    if(choice===correct){score++;streak++;flash("\u2713 Correct \u2014 "+correct+" vs a jam",true);showPcts(cd.BB[cur].p);updateStats();afterResolved(true);}
    else{streak=0;flash("\u2717 "+cur+" vs a jam is "+correct+" (you picked "+choice+")",false);recordMiss();showPcts(cd.BB[cur].p);updateStats();afterResolved(false);}
  },function(a){return a.toLowerCase();});
}

/* ---- Main answer handlers per position ---- */
function answerBTN(choice){
  if(answered)return;answered=true;
  const correct=btnOpenData(curDepth)[cur].a;total++;
  if(choice===correct){
    score++;streak++;flash("\u2713 Correct \u2014 "+correct,true);
    if(drillMode==="miss")misses=misses.filter(m=>!(m.pos===curPos&&m.depth===curDepth&&m.hand===cur));
    showPcts(btnOpenData(curDepth)[cur].p);updateStats();
    if(correct==="Open"&&hasCall(curDepth)&&(liveCall(curDepth,"BB")||liveCall(curDepth,"SB"))){
      document.getElementById("nextBtn").style.display="none";
      setTimeout(()=>askCall(),450);
    }else{afterResolved(true);}
  }else{
    streak=0;flash("\u2717 "+cur+" @ "+curDepth+"BB is "+correct+" (you picked "+choice+")",false);
    showMatrixForPos("BTN",curDepth,cur);recordMiss();showPcts(btnOpenData(curDepth)[cur].p);updateStats();afterResolved(false);
  }
}

function answerSB(choice){
  if(answered)return;answered=true;
  const key=sbActionKey(choice,curDepth);
  const correct=sbData(curDepth)[cur].a;total++;
  if(key===correct){
    score++;streak++;flash("\u2713 Correct \u2014 "+sbKeyToLabel(correct,curDepth),true);
    if(drillMode==="miss")misses=misses.filter(m=>!(m.pos===curPos&&m.depth===curDepth&&m.hand===cur));
    showPcts(sbData(curDepth)[cur].p);updateStats();afterResolved(true);
  }else{
    streak=0;flash("\u2717 "+cur+" @ "+curDepth+"BB is "+sbKeyToLabel(correct,curDepth)+" (you picked "+choice+")",false);
    showMatrixForPos("SB",curDepth,cur);recordMiss();showPcts(sbData(curDepth)[cur].p);updateStats();afterResolved(false);
  }
}

function answerBB(choice){
  if(answered)return;answered=true;
  const key=bbActionKey(choice,curDepth);
  const correct=bbData(curDepth)[cur].a;total++;
  if(key===correct){
    score++;streak++;flash("\u2713 Correct \u2014 "+bbKeyToLabel(correct,curDepth),true);
    if(drillMode==="miss")misses=misses.filter(m=>!(m.pos===curPos&&m.depth===curDepth&&m.hand===cur));
    showPcts(bbData(curDepth)[cur].p);updateStats();afterResolved(true);
  }else{
    streak=0;flash("\u2717 "+cur+" @ "+curDepth+"BB is "+bbKeyToLabel(correct,curDepth)+" (you picked "+choice+")",false);
    showMatrixForPos("BB",curDepth,cur);recordMiss();showPcts(bbData(curDepth)[cur].p);updateStats();afterResolved(false);
  }
}

/* ---- Question generation ---- */
function newQuestion(){
  if(advanceTimer){clearTimeout(advanceTimer);advanceTimer=null;}
  answered=false;phase="main";
  const q=pickQuestion();const empty=document.getElementById("emptyMiss");
  if(!q){
    document.getElementById("handLabel").textContent="\u2014\u2014";document.getElementById("answerBtns").innerHTML="";
    document.getElementById("feedback").textContent="";document.getElementById("pcts").textContent="";
    document.getElementById("qtitle").textContent="";document.getElementById("nextBtn").style.display="none";
    document.getElementById("matrixWrap").classList.remove("show");
    empty.style.display=drillMode==="miss"?"block":"none";
    if(drillMode==="mixed"){empty.style.display="block";empty.textContent="No mixed cells at this selection.";}
    return;
  }
  empty.style.display="none";curPos=q.pos;curDepth=q.depth;cur=q.hand;
  document.getElementById("handLabel").textContent=cur;
  document.getElementById("depthLabel").textContent=curDepth;
  document.getElementById("depthLine").innerHTML="Effective stack: <b>"+curDepth+"</b> BB \u00b7 "+(SPOT_DESC[curPos]||curPos);
  document.getElementById("feedback").textContent="";document.getElementById("feedback").className="feedback";
  document.getElementById("pcts").textContent="";document.getElementById("nextBtn").style.display="none";
  document.getElementById("matrixWrap").classList.remove("show");
  document.getElementById("qtitle").innerHTML="What\u2019s your action?";
  if(curPos==="BTN"){setButtons(btnOpenActions(curDepth),answerBTN,a=>({Fold:"fold",Open:"open",Push:"push"}[a]||""));}
  else if(curPos==="SB"){setButtons(sbActions(curDepth),answerSB,a=>sbBtnClass(a,curDepth));}
  else if(curPos==="BB"){setButtons(bbActions(curDepth),answerBB,a=>bbBtnClass(a,curDepth));}
}

/* ---- View charts ---- */
function buildViewTabs(){
  const box=document.getElementById("viewTabs");box.innerHTML="";
  const tabs=[];
  ["BTN","SB","BB"].forEach(pos=>{
    ["25","15","10"].forEach(d=>{
      if(getRangeData(pos,d))tabs.push({label:pos+" "+d,pos,d});
    });
  });
  /* BTN call charts */
  ["15","10"].forEach(d=>{if(DATA.BTN.call&&DATA.BTN.call[d]){
    ["BB","SB"].forEach(who=>tabs.push({label:"BTN call vs "+who+" "+d,pos:"BTNcall",d,who}));
  }});
  tabs.forEach((t,i)=>{
    const b=document.createElement("button");b.className="tab"+(i===0?" active":"");b.textContent=t.label;
    b.dataset.idx=i;b.onclick=()=>{
      box.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");
      renderViewTab(t);
    };box.appendChild(b);
  });
  if(tabs.length)renderViewTab(tabs[0]);
}
function renderViewTab(t){
  const vm=document.getElementById("viewMatrix"),vl=document.getElementById("viewLegend");
  if(t.pos==="BTNcall"){
    const cd=DATA.BTN.call[t.d][t.who];
    vl.innerHTML=Object.entries(C_BTN_CALL).map(([k,v])=>'<span><i class="sw" style="background:'+v+'"></i>'+k+'</span>').join("");
    buildMatrix(vm,h=>cd[h]?cd[h].a:"NA",C_BTN_CALL,a=>a==="NA",null);
  }else{
    const dd=getRangeData(t.pos,t.d);const cm=getColorMap(t.pos);
    vl.innerHTML=Object.entries(cm).map(([k,v])=>'<span><i class="sw" style="background:'+v+'"></i>'+k+'</span>').join("");
    buildMatrix(vm,h=>dd[h]?dd[h].a:"Fold",cm,null,null);
  }
}

/* ---- Wiring ---- */
document.querySelectorAll("#depthTabs .tab").forEach(t=>{t.onclick=()=>{document.querySelectorAll("#depthTabs .tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");depthMode=t.dataset.d;newQuestion();};});
document.querySelectorAll("#modeTabs .tab").forEach(t=>{t.onclick=()=>{document.querySelectorAll("#modeTabs .tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");drillMode=t.dataset.m;newQuestion();};});
const autoCb=document.getElementById("autoAdvance");autoCb.checked=autoAdvance;
autoCb.onchange=()=>{autoAdvance=autoCb.checked;lsSet("autoAdvance",autoAdvance?"1":"0");};

document.querySelectorAll(".posbar .postab").forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll(".posbar .postab").forEach(x=>x.classList.remove("active"));t.classList.add("active");
    posMode=t.dataset.pos;
    if(advanceTimer){clearTimeout(advanceTimer);advanceTimer=null;}
    newQuestion();
  };
});

document.addEventListener("keydown",e=>{
  if(!answered){
    const k=e.key.toLowerCase();
    if(phase==="main"){
      if(curPos==="BTN"){if(k==="f")answerBTN("Fold");else if(k==="r")answerBTN("Open");else if(k==="p"&&curDepth!=="25")answerBTN("Push");}
    }else{
      const b=document.querySelectorAll("#answerBtns .ab");
      if(k==="c")b[0]&&b[0].click();else if(k==="f")b[1]&&b[1].click();
    }
  }else if(e.key===" "||e.key==="Enter"){e.preventDefault();const n=document.getElementById("nextBtn");if(n.style.display!=="none")n.onclick();}
});

buildViewTabs();
newQuestion();
updateStats();
</script>
</body>
</html>
